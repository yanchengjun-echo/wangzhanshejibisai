<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>银绣山河 · 苗族银饰与刺绣数字馆</title>
<meta name="description" content="银绣山河——以苗族银饰锻造技艺与苗绣纹样为线索的数字展馆，从飞鸟纹、角花纹到靛蓝蜡染，拾起苗岭之间的手艺与山河。">
<meta name="theme-color" content="#08172c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1f38'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23dce6f3' stroke-width='1.5' stroke-dasharray='1.6 2.4'/%3E%3Cpath d='M10.5 18.5c3-4.6 8.4-4.2 11-1.2-2.2-4.6-7.6-4.4-9.2-2.4' fill='%23dce6f3'/%3E%3C/svg%3E">
<link rel="canonical" href="https://example.com/">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="银绣山河 · 苗族银饰与刺绣数字馆">
<meta property="og:description" content="靛蓝为底，银白为光。以九幅苗绣飞鸟纹，串起苗族银饰与刺绣的手艺山河。">
<meta property="og:image" content="assets/bg-water.jpg">
<meta property="og:locale" content="zh_CN">

<!-- 标题字体：演示悠然小楷（子集，仅含「银绣山河」四字，5.7KB 本地加载） -->
<link rel="preload" href="assets/fonts/youran-xiaokai-title.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/main.css">

<!-- 入场动画的开关：只有脚本确认能跑，才给 html 加 anim 类。
     这样即使脚本被拦截、动画失败，页面也是完整可见的，不会白屏。 -->
<script>
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('anim');
  }
</script>
</head>
<body>

<div class="stage">
  <!-- 背景层：第二张图（青花水波）+ 靛蓝罩色 -->
  <div class="layer-bg" aria-hidden="true"></div>
  <div class="layer-tint" aria-hidden="true"></div>
  <div class="layer-grain" aria-hidden="true"></div>

  <!-- 四角纹样：取自第四张图的角花，四向镜像 -->
  <div class="ornaments" aria-hidden="true">
    <img class="orn orn--tl" src="assets/orn-bird.png" alt="" width="660" height="827">
    <img class="orn orn--tr" src="assets/orn-bird.png" alt="" width="660" height="827">
    <img class="orn orn--bl" src="assets/orn-bird.png" alt="" width="660" height="827">
    <img class="orn orn--br" src="assets/orn-bird.png" alt="" width="660" height="827">
  </div>

  <main class="hero" id="top">

    <!-- 标题：银绣（左） 山河（右），中间留出纹样徽章 -->
    <h1 class="titles" aria-label="银绣山河">
      <span class="title title--left" aria-hidden="true"><i style="--d:.20s">银</i><i style="--d:.34s">绣</i></span>
      <span class="title title--right" aria-hidden="true"><i style="--d:.48s">山</i><i style="--d:.62s">河</i></span>
    </h1>

    <!-- 中央徽章：苗银环 + 九幅飞鸟纹，边旋转边切换 -->
    <div class="medallion" role="img" aria-label="银环之中，苗绣飞鸟纹样缓缓旋转并依次显现">
      <span class="halo" aria-hidden="true"></span>

      <svg class="rings" viewBox="0 0 400 400" aria-hidden="true" focusable="false">
        <circle class="ring ring--hair"  cx="200" cy="200" r="196"/>
        <circle class="ring ring--bead"  cx="200" cy="200" r="181"/>
        <circle class="ring ring--dash"  cx="200" cy="200" r="166"/>
        <circle class="ring ring--inner" cx="200" cy="200" r="150"/>
        <g class="spikes">
          <rect x="196" y="188" width="8" height="8" transform="rotate(0 200 200)"/>
          <rect x="196" y="188" width="8" height="8" transform="rotate(45 200 200)"/>
          <rect x="196" y="188" width="8" height="8" transform="rotate(90 200 200)"/>
          <rect x="196" y="188" width="8" height="8" transform="rotate(135 200 200)"/>
          <rect x="196" y="188" width="8" height="8" transform="rotate(180 200 200)"/>
          <rect x="196" y="188" width="8" height="8" transform="rotate(225 200 200)"/>
          <rect x="196" y="188" width="8" height="8" transform="rotate(270 200 200)"/>
          <rect x="196" y="188" width="8" height="8" transform="rotate(315 200 200)"/>
        </g>
      </svg>

      <span class="disc" aria-hidden="true"></span>

      <div class="birds" aria-hidden="true">
        <img style="--i:0" src="assets/bird-01.png" alt="" width="700" height="700">
        <img style="--i:1" src="assets/bird-02.png" alt="" width="700" height="700">
        <img style="--i:2" src="assets/bird-03.png" alt="" width="700" height="700">
        <img style="--i:3" src="assets/bird-04.png" alt="" width="700" height="700">
        <img style="--i:4" src="assets/bird-05.png" alt="" width="700" height="700">
        <img style="--i:5" src="assets/bird-06.png" alt="" width="700" height="700">
        <img style="--i:6" src="assets/bird-07.png" alt="" width="700" height="700">
        <img style="--i:7" src="assets/bird-08.png" alt="" width="700" height="700">
        <img style="--i:8" src="assets/bird-09.png" alt="" width="700" height="700">
      </div>
    </div>

    <!-- 底部导航：数字占位，待接入各板块 -->
    <div class="footer">
      <div class="divider" aria-hidden="true"><span class="divider-gem"></span></div>
      <img class="orn-center" src="assets/orn-sprig.png" alt="" width="220" height="197" aria-hidden="true">
      <nav class="nav" aria-label="主导航">
        <a class="nav-item" href="#" aria-label="第一板块（待命名）"><span class="num">01</span><span class="tick"></span></a>
        <a class="nav-item" href="#" aria-label="第二板块（待命名）"><span class="num">02</span><span class="tick"></span></a>
        <a class="nav-item" href="#" aria-label="第三板块（待命名）"><span class="num">03</span><span class="tick"></span></a>
        <a class="nav-item" href="#" aria-label="第四板块（待命名）"><span class="num">04</span><span class="tick"></span></a>
      </nav>
    </div>

  </main>
</div>

</body>
</html>
