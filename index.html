<!-- 样式表自愈：分享链接偶发中途断流时，某张 CSS 会整份不生效，页面退化成无样式
     （导航消失、列表序号露出来、卡片排版消失）。解析完成后再核对每张表是否真的
     解析出规则，失败的带时间戳重取，最多两次；正常加载时什么都不做，不影响缓存。 -->
<script data-css-guard>
(function () {
  var MAX = 2;
  function heal() {
    var links = document.querySelectorAll('link[rel="stylesheet"]');
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var n = parseInt(l.getAttribute('data-css-retry') || '0', 10);
      if (n >= MAX) continue;
      var ok = false;
      if (l.sheet) {
        try { ok = !!(l.sheet.cssRules && l.sheet.cssRules.length); }
        catch (e) { ok = true; }   /* 跨源时读不到规则，视为正常 */
      }
      if (!ok) {
        l.setAttribute('data-css-retry', String(n + 1));
        l.href = l.href.split('?')[0] + '?fix=' + Date.now();
      }
    }
  }
  window.addEventListener('load', heal);
  setTimeout(heal, 3000);
})();
</script>

<!-- ==================================================================

<section class="map-sec" id="map-sec" aria-labelledby="map-title">

         aria-label="苗族非物质文化遗产分布地图，可点击省份或聚居地查看代表性非遗条目"></div>

    <div id="callout-layer"></div>

    <!-- 题头：轻量悬浮，不占地图空间 -->

      <span class="map-head__no" aria-hidden="true">贰</span>

    </div>

    <!-- 手机竖屏的操作提示（宽屏由 CSS 隐藏） -->
    <p class="map-hint">点按地图上的省份或自治州，查看代表性非遗条目</p>

    <!-- 海南附图说明 -->

      <b>海南省 · 附图</b>
      <span>盘皇舞 · 苗族民歌 · 三色饭</span>
    </button>

    <!-- 来源注记：压成一行贴底，避免和左下角的引线标注抢地方 -->
    <p class="footnote">
      条目为代表性示例，正式名录以国务院公布为准 · 底图 DataV.GeoAtlas 标准行政区划
    </p>

    <!-- 加载中 -->

      <div class="map-spinner"></div>
      <div>地图加载中…</div>
    </div>
