<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>巧手成纹 · 蜡染与苗绣线上体验 | 银绣山河</title>
<meta name="description" content="银绣山河线上体验：亲手画一笔蜡、浸一次染缸，看冰裂纹在靛蓝布上蔓延；再用虚拟绣绷走一遍平绣与打籽绣的针脚。">
<meta name="theme-color" content="#0A1219">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1f38'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23dce6f3' stroke-width='1.5' stroke-dasharray='1.6 2.4'/%3E%3Cpath d='M10.5 18.5c3-4.6 8.4-4.2 11-1.2-2.2-4.6-7.6-4.4-9.2-2.4' fill='%23dce6f3'/%3E%3C/svg%3E">
<link rel="canonical" href="https://yinxue-shanhe.app.workbuddy.host/experience.html">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="巧手成纹 · 蜡染与苗绣线上体验">
<meta property="og:description" content="画一笔蜡，浸一次染缸，看冰裂纹在靛蓝布上蔓延。">
<meta property="og:image" content="assets/bg-water.jpg">
<meta property="og:locale" content="zh_CN">

<link rel="preload" href="assets/fonts/youran-xiaokai-title.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/experience.css">
<link rel="stylesheet" href="assets/css/bgm.css">
</head>
<body class="exp-root">

<!-- ======================================================================
     入口屏：滚动联动
     左 素布 —— 朱红丝线随滚动游走，针尖由 intro.js 用 getPointAtLength 贴住线头
     中 标题 —— 「巧手成纹」+ 两个入口按钮
     右 染缸 —— 靛蓝染液上涨，同心涟漪渐起
     ====================================================================== -->
<section class="intro" id="intro" aria-label="线上体验入口">

  <div class="intro__scene">

    <!-- 左：素布 -->
    <div class="cloth" aria-hidden="true">
      <span class="cloth__frame"></span>
      <svg class="cloth__svg" viewBox="0 0 320 620" preserveAspectRatio="xMidYMid meet">
        <!-- 底纹：随滚动渐显的苗绣纹样轮廓 -->
        <g class="cloth__pattern">
          <path d="M44 92 q22 -26 44 0 t44 0" />
          <path d="M44 512 q22 -26 44 0 t44 0" />
          <path d="M212 296 q26 20 0 44 t0 44" />
          <circle cx="250" cy="84" r="15" />
          <circle cx="70" cy="404" r="19" />
        </g>

        <!-- 游走的朱红丝线（长度由 JS 读取后做 dashoffset 动画）。
             注：不用 vector-effect="non-scaling-stroke"——它会把 dasharray
             一起换算到设备空间，和 dashoffset 动画冲突；窄屏改用媒体查询加粗 -->
        <path class="cloth__thread" id="threadPath" d="M160 52
          C 96 52 74 104 108 132
          C 146 164 214 128 226 172
          C 240 224 168 236 118 258
          C 66 281 62 338 112 356
          C 166 375 226 344 232 392
          C 238 442 172 462 126 486
          C 82 509 92 556 148 566" />

        <!-- 针：针尖在原点，针身朝上；JS 按路径切向旋转 -->
        <g class="cloth__needle" id="threadNeedle">
          <line class="needle-body" x1="0" y1="0" x2="0" y2="-34" />
          <ellipse class="needle-eye" cx="0" cy="-28.5" rx="1.2" ry="2.8" />
        </g>
      </svg>
    </div>

    <!-- 中：标题与两个入口 -->
    <div class="intro__content">
      <p class="intro__kicker">03 · 线上体验</p>
      <h1 class="intro__title">巧手成纹</h1>
      <p class="intro__lede">
        画一笔蜡，浸一次染缸，看冰裂纹在靛蓝布上慢慢蔓延；<br>
        再穿一根针，把苗绣的纹样一针一针走完。
      </p>

      <div class="intro__enter" role="group" aria-label="选择体验线路">
        <a class="enter-btn" href="#workbench" data-enter="dye">
          <span class="enter-btn__tag">蜡染</span>
          <span class="enter-btn__body">
            <span class="enter-btn__name">走进染缸</span>
            <span class="enter-btn__note">画蜡 · 浸染 · 冰裂　三幕</span>
          </span>
          <svg class="enter-btn__arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" stroke="currentColor"
                  stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a class="enter-btn enter-btn--embroidery" href="#workbench" data-enter="embroidery">
          <span class="enter-btn__tag">苗绣</span>
          <span class="enter-btn__body">
            <span class="enter-btn__name">坐上绣绷</span>
            <span class="enter-btn__note">平绣 · 打籽绣　两种针法</span>
          </span>
          <svg class="enter-btn__arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" stroke="currentColor"
                  stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- 右：染缸 -->
    <div class="vat" aria-hidden="true">
      <div class="vat__liquid"></div>
      <div class="vat__rings">
        <span class="vat__ring" style="--d:0s"></span>
        <span class="vat__ring" style="--d:1.4s"></span>
        <span class="vat__ring" style="--d:2.8s"></span>
        <span class="vat__ring" style="--d:4.2s"></span>
        <span class="vat__ring" style="--d:5.6s"></span>
      </div>
    </div>

    <!-- 滚动提示 + 底部进度线 -->
    <div class="intro__hint" aria-hidden="true">
      <span>向下滚动</span>
      <i></i>
    </div>
    <div class="intro__progress" aria-hidden="true"></div>

  </div>
</section>

<!-- ======================================================================
     工作台：蜡染（画蜡 → 浸染 → 冰裂）与苗绣（虚拟绣绷）
     ====================================================================== -->
<div class="exp-page" id="workbench">

  <!-- ===== 页头 ===== -->
  <header class="exp-head">
    <h1 class="exp-title">巧手成纹</h1>
    <p class="exp-sub">画一笔蜡 · 浸一次染缸 · 走一针苗绣</p>
  </header>

  <!-- ===== 三栏主体 ===== -->
  <div class="exp-body">

    <!-- 左：工具面板 -->
    <aside class="exp-side exp-side--left" aria-label="创作工具">

      <section class="panel">
        <h2 class="panel__title">体验模式</h2>
        <div class="seg" role="group" aria-label="选择体验模式">
          <button class="seg__item" type="button" data-mode="dye" aria-pressed="true">蜡染</button>
          <button class="seg__item" type="button" data-mode="embroidery" aria-pressed="false">苗绣</button>
        </div>
      </section>

      <!-- 蜡染工具 -->
      <section class="panel" data-panel="dye">
        <h2 class="panel__title">笔触粗细</h2>
        <div class="seg" role="group" aria-label="笔触粗细">
          <button class="seg__item" type="button" data-wax-width="4" aria-pressed="false">细</button>
          <button class="seg__item" type="button" data-wax-width="6" aria-pressed="true">中</button>
          <button class="seg__item" type="button" data-wax-width="10" aria-pressed="false">粗</button>
        </div>
        <hr class="panel__rule">
        <h2 class="panel__title">工序</h2>
        <ol class="steps" id="dyeSteps" aria-label="蜡染工序进度">
          <li class="step is-active" data-step="waxing"><span class="step__dot"></span>画蜡</li>
          <li class="step" data-step="dyeing"><span class="step__dot"></span>浸染</li>
          <li class="step" data-step="cracking"><span class="step__dot"></span>冰裂</li>
        </ol>
      </section>

      <!-- 苗绣工具 -->
      <section class="panel" data-panel="embroidery" hidden>
        <h2 class="panel__title">针法</h2>
        <div class="seg" role="group" aria-label="选择针法">
          <button class="seg__item" type="button" data-stitch="flat" aria-pressed="true">平绣</button>
          <button class="seg__item" type="button" data-stitch="seed" aria-pressed="false">打籽绣</button>
        </div>
        <hr class="panel__rule">
        <h2 class="panel__title">丝线颜色</h2>
        <div class="swatches" id="threadSwatches" role="group" aria-label="丝线颜色">
          <button class="swatch" type="button" style="--c:#C23B22" data-color="#C23B22" aria-pressed="true"  aria-label="苗绣红"></button>
          <button class="swatch" type="button" style="--c:#5B2C6F" data-color="#5B2C6F" aria-pressed="false" aria-label="苗绣紫"></button>
          <button class="swatch" type="button" style="--c:#D9A03C" data-color="#D9A03C" aria-pressed="false" aria-label="姜黄"></button>
          <button class="swatch" type="button" style="--c:#2E7D6B" data-color="#2E7D6B" aria-pressed="false" aria-label="松绿"></button>
          <button class="swatch" type="button" style="--c:#1F4E79" data-color="#1F4E79" aria-pressed="false" aria-label="靛蓝"></button>
          <button class="swatch" type="button" style="--c:#E8E4D8" data-color="#E8E4D8" aria-pressed="false" aria-label="素白"></button>
        </div>
        <hr class="panel__rule">
        <h2 class="panel__title">针法演示</h2>
        <div class="stitch-demo" id="stitchDemo" aria-hidden="true"></div>
      </section>

    </aside>

    <!-- 中：画布舞台 -->
    <section class="exp-stage" id="expStage" aria-label="创作画布">

      <!-- 蜡染：双层 canvas（底层素布+蜡迹 / 上层靛蓝遮罩） -->
      <div class="canvas-wrap" data-canvas="dye">
        <canvas id="dyeFabric" class="canvas canvas--fabric"></canvas>
        <canvas id="dyeBlue" class="canvas canvas--blue"></canvas>
        <p class="canvas-hint" id="dyeHint">按住并拖动，在素布上画一笔蜡</p>
      </div>

      <!-- 苗绣：虚拟绣绷 -->
      <div class="canvas-wrap" data-canvas="embroidery" hidden>
        <div class="hoop" id="embroideryHoop">
          <svg class="hoop-svg" id="hoopSvg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet">
            <defs>
              <!-- 布面质感：径向渐变模拟绷紧的坯布受光 -->
              <radialGradient id="hoopClothGrad" cx="34%" cy="27%" r="78%">
                <stop offset="0" stop-color="#FCFAF2" />
                <stop offset=".55" stop-color="#F0EADA" />
                <stop offset="1" stop-color="#DCD2BA" />
              </radialGradient>

              <!-- 可绣区域：背扇轮廓，超出部分被裁掉 -->
              <clipPath id="hoopClip">
                <path d="M300 96 C 402 96 478 156 478 252 C 478 362 400 452 300 508
                         C 200 452 122 362 122 252 C 122 156 198 96 300 96 Z" />
              </clipPath>
            </defs>

            <!-- 木绷圈：外圈木色 + 内侧高光，整体 600×600 等比缩放，永远是正圆 -->
            <circle class="hoop-wood" cx="300" cy="300" r="292" />
            <circle class="hoop-wood-inner" cx="300" cy="300" r="279" />

            <!-- 绷紧的坯布 -->
            <circle class="hoop-cloth" cx="300" cy="300" r="279" fill="url(#hoopClothGrad)" />

            <!-- 底样引导线 -->
            <g class="hoop-guide">
              <path d="M300 152 C 356 206 356 320 300 398 C 244 320 244 206 300 152 Z" />
              <circle cx="300" cy="276" r="58" />
              <path d="M300 208 L 300 344" />
              <path d="M232 276 L 368 276" />
            </g>

            <!-- 背扇外轮廓 -->
            <path class="hoop-outline"
                  d="M300 96 C 402 96 478 156 478 252 C 478 362 400 452 300 508
                     C 200 452 122 362 122 252 C 122 156 198 96 300 96 Z" />

            <!-- 针迹层：clip 到背扇轮廓内 -->
            <g id="stitchLayer" clip-path="url(#hoopClip)"></g>
          </svg>
        </div>
        <p class="canvas-hint" id="hoopHint">在绣绷上移动鼠标，一针一针走线</p>
      </div>

    </section>

    <!-- 右：预览与操作 -->
    <aside class="exp-side exp-side--right" aria-label="实时预览与操作">

      <section class="panel">
        <h2 class="panel__title">实时预览</h2>
        <div class="preview-box">
          <canvas id="previewCanvas" class="preview-canvas"></canvas>
          <span class="preview-label" id="previewLabel">素坯</span>
        </div>
      </section>

      <section class="panel" data-panel="dye">
        <h2 class="panel__title">操作</h2>
        <button class="btn btn--primary btn--block" type="button" id="btnDye">浸入染缸</button>
        <hr class="panel__rule">
        <button class="btn btn--block" type="button" id="btnReset">重新开始</button>
        <p class="panel__note" id="dyeNote" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" data-panel="embroidery" hidden>
        <h2 class="panel__title">操作</h2>
        <button class="btn btn--primary btn--block" type="button" id="btnStitchClear">清空针迹</button>
        <p class="panel__note" id="stitchCount" role="status" aria-live="polite">已绣 0 针</p>
      </section>

    </aside>

  </div>
</div>

<script src="assets/js/intro.js"></script>
<script src="assets/js/studio.js"></script>
<script src="assets/js/dye.js"></script>
<script src="assets/js/embroidery.js"></script>
<script src="assets/js/bgm.js"></script>
</body>
</html>
