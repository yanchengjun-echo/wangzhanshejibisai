<div class="page">

  <div class="grain" aria-hidden="true"></div>

    <!-- 右侧：树状双线时间轴 -->

      <div class="tl-head">
        <h2 class="tl-title" id="tlTitle">历史脉络</h2>
        <p class="tl-note">传说与信史双线 · 滚轮横向浏览</p>
      </div>

      <div class="tl-scroll" id="tlScroll" tabindex="0" role="region" aria-label="苗族历史时间轴，可横向滚动">
        <div class="track">

          <!-- 根系：从左侧铺开，收成主干后分成传说、信史两支 -->
          <div class="roots" aria-hidden="true">
            <svg viewBox="0 0 200 100" preserveAspectRatio="none" focusable="false">
              <g class="root-line r-gold">
                <path d="M0,4 C62,10 132,14 200,20"/>
                <path d="M0,12 C58,15 132,17 200,20"/>
                <path d="M0,30 C64,30 134,24 200,20"/>
                <path d="M0,47 C64,41 132,27 200,20"/>

                <path class="r-thin" d="M58,54 C50,62 58,70 48,76"/>
                <path class="r-thin" d="M104,69 C112,74 116,80 126,81"/>
                <path class="r-thin" d="M140,76 C148,71 152,65 162,65"/>
              </g>
            </svg>
          </div>

          <!-- 传说线（暖金） -->
          <div class="branch branch--legend">
            <span class="b-tag" aria-hidden="true">传说</span>
            <ol class="nodes">
              <!--
                节点填写方式：
                1. 把 .nm 的文字换成事件名称，.era 换成年代或时期
                2. 补 data-summary（一句话摘要）、data-keywords（顿号分隔）、data-href（详情页地址）
                3. 内容填好后删掉 li 上的 is-empty 类，卡片就会从「待补」切成正式态
              -->
              <li class="node is-empty" data-line="legend" data-summary="" data-keywords="" data-href="">
                <button class="node-btn" type="button" aria-label="传说线第 1 个节点：事件名称待补">
                  <span class="nm">事件名称待补</span>
                  <span class="era">年代待补</span>
                </button>
                <span class="dot" aria-hidden="true"></span>
              </li>
              <li class="node is-empty" data-line="legend" data-summary="" data-keywords="" data-href="">
                <button class="node-btn" type="button" aria-label="传说线第 2 个节点：事件名称待补">
                  <span class="nm">事件名称待补</span>
                  <span class="era">年代待补</span>
                </button>
                <span class="dot" aria-hidden="true"></span>
              </li>
              <li class="node is-empty" data-line="legend" data-summary="" data-keywords="" data-href="">
                <button class="node-btn" type="button" aria-label="传说线第 3 个节点：事件名称待补">
                  <span class="nm">事件名称待补</span>
                  <span class="era">年代待补</span>
                </button>
                <span class="dot" aria-hidden="true"></span>
              </li>
              <li class="node is-empty" data-line="legend" data-summary="" data-keywords="" data-href="">
                <button class="node-btn" type="button" aria-label="传说线第 4 个节点：事件名称待补">
                  <span class="nm">事件名称待补</span>
                  <span class="era">年代待补</span>
                </button>
                <span class="dot" aria-hidden="true"></span>
              </li>
            </ol>
          </div>

          <!-- 信史线（银白） -->
          <div class="branch branch--history">
            <span class="b-tag" aria-hidden="true">信史</span>
            <ol class="nodes">
              <li class="node is-empty" data-line="history" data-summary="" data-keywords="" data-href="">
                <button class="node-btn" type="button" aria-label="信史线第 1 个节点：事件名称待补">
                  <span class="nm">事件名称待补</span>
                  <span class="era">年代待补</span>

                <span class="dot" aria-hidden="true"></span>

              <li class="node is-empty" data-line="history" data-summary="" data-keywords="" data-href="">

              <li class="node is-empty" data-line="history" data-summary="" data-keywords="" data-href="">

                  <span class="nm">事件名称待补</span>
                  <span class="era">年代待补</span>

                <span class="dot" aria-hidden="true"></span>

              <li class="node is-empty" data-line="history" data-summary="" data-keywords="" data-href="">

                  <span class="era">年代待补</span>
                </button>
                <span class="dot" aria-hidden="true"></span>

            </ol>
          </div>

        </div>
